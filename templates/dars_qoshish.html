<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Yangi dars qo'shish</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #6c63ff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .btn-back { display: inline-block; margin-top: 15px; text-decoration: none; color: #6c63ff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Yangi dars qo'shish</h2>
        <form action="/dars-qoshish" method="POST">
            <label>Dars nomi:</label>
            <input type="text" name="nomi" required>

            <label>Darajasi:</label>
            <select name="daraja">
                <option value="Boshlang'ich">Boshlang'ich</option>
                <option value="O'rta">O'rta</option>
                <option value="Yuqori">Yuqori</option>
            </select>

            <label>Tavsif (Matn):</label>
            <textarea name="tavsif" rows="8" required></textarea>

            <label>Rasm havolasi (URL):</label>
            <input type="text" name="rasm" placeholder="https://example.com/rasm.png">

            <label>Video URL (ixtiyoriy):</label>
            <input type="text" name="video_url">

            <label>Kodlar (ixtiyoriy):</label>
            <textarea name="kodlar" rows="4"></textarea>

            <button type="submit">Qo'shish</button>
        </form>
        <a href="/" class="btn-back">← Orqaga qaytish</a>
    </div>
</body>
</html>
