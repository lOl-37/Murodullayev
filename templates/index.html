<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Python va FastAPI Darslari</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 24px; }
        .nav-links a, .nav-links span { color: white; background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 14px; margin-left: 10px; transition: background 0.2s; display: inline-block; }
        .nav-links a:hover { background: rgba(255,255,255,0.3); }
        .dars-card { background: white; padding: 25px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #667eea; }
        .dars-card h3 { color: #2d3748; margin-bottom: 10px; font-size: 20px; }
        .dars-card p { color: #718096; margin-bottom: 15px; }
        a.btn { display: inline-block; background-color: #667eea; color: white; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: 600; }
        a.btn:hover { background-color: #5a67d8; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Python va FastAPI Darslari</h1>
            <div class="nav-links">
                {% if is_logged_in %}
                    <span style="font-weight: bold;">👤 {{ username if username else 'Admin' }}</span>
                    <a href="/profile">Profil</a>
                    <a href="/logout">Chiqish</a>
                {% else %}
                    <a href="/login">Kirish</a>
                    <a href="/register">Ro'yxatdan o'tish</a>
                {% endif %}
            </div>
        </header>

        {% for dars in darslar %}
            <div class="dars-card">
                <h3>{{ dars.nomi }}</h3>
                <p><b>Daraja:</b> {{ dars.daraja }}</p>
                <a href="/dars/{{ dars.id }}" class="btn">Darsni ko'rish →</a>
            </div>
        {% endfor %}
    </div>
</body>
</html>
